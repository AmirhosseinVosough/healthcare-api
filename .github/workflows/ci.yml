name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres and real Redis, not stand-ins. Half of what this suite
    # checks — row-level security, exclusion constraints, atomic Lua — does
    # not exist in a substitute, and a green run against one would prove
    # nothing about the things worth proving.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare
          POSTGRES_DB: healthcare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U healthcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://healthcare:healthcare@localhost:5433/healthcare
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-anywhere-real-0123456789abcdef
      BCRYPT_ROUNDS: "4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Lint
        run: ruff check app scripts tests

      - name: Formatting
        run: ruff format --check app scripts tests

      - name: Migrations
        run: alembic upgrade head

      - name: Migrations reverse cleanly
        # A migration nobody can undo is a migration nobody dares run.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -q

      - name: Known vulnerabilities in dependencies
        # Not blocking: a new advisory against a pinned library should be
        # visible the morning it lands, without turning every unrelated pull
        # request red until someone has time to look at it.
        run: pip-audit --requirement requirements.txt --strict || true
